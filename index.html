<title>SisPla Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F3F5; --panel:#FFFFFF; --panel2:#F7F8FA; --ink:#1B232D; --muted:#66707C; --line:#D5DBE1;
  --accent:#2E5C8A; --accent-ink:#FFFFFF; --accent-soft:#E3ECF5;
  --design:#A5661A; --design-ink:#FFFFFF; --design-soft:#FBF0DF;
  --side:#1A2530; --side-ink:#C9D3DD; --side-muted:#7C8B99; --side-active:#2E5C8A;
  --ok:#2E7D5B; --bad:#B23A3A; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1B222A; --panel2:#212932; --ink:#E3E8ED; --muted:#93A0AD; --line:#2E3842;
  --accent:#7FADDC; --accent-ink:#0E1A26; --accent-soft:#233748;
  --design:#E2A857; --design-ink:#1F1608; --design-soft:#3B2D18;
  --side:#0D1218; --side-ink:#C2CCD6; --side-muted:#6F7E8C; --side-active:#2E5C8A;
  --ok:#5FB58D; --bad:#E07373; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1B222A; --panel2:#212932; --ink:#E3E8ED; --muted:#93A0AD; --line:#2E3842;
  --accent:#7FADDC; --accent-ink:#0E1A26; --accent-soft:#233748;
  --design:#E2A857; --design-ink:#1F1608; --design-soft:#3B2D18;
  --side:#0D1218; --side-ink:#C2CCD6; --side-muted:#6F7E8C; --side-active:#2E5C8A;
  --ok:#5FB58D; --bad:#E07373; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding-block:18px;padding-inline:0}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{font-size:17px;letter-spacing:.02em;display:block}
.brand span{font-size:11.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-size:13.5px}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:var(--side-active);color:#fff}
nav a.sub{padding-left:28px;font-size:13px}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:14px 10px 4px}
nav .ic{width:16px;text-align:center;opacity:.85;font-size:12px}
.side-foot{padding:10px 18px 0;font-size:11.5px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:5px;padding:4px 8px;font-size:11.5px;margin-top:6px}
.menu-tg{background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:5px;padding:5px 10px;font-size:12px;margin:8px 8px 0;display:flex;align-items:center;gap:8px;justify-content:center}
.menu-tg:hover{background:rgba(255,255,255,.06)}
.app.menu-plegado{grid-template-columns:56px 1fr}
.app.menu-plegado .brand{padding-inline:0;text-align:center}
.app.menu-plegado .brand b{font-size:13px}
.app.menu-plegado .brand span,.app.menu-plegado nav .grp,.app.menu-plegado nav a .lbl,.app.menu-plegado .side-foot,.app.menu-plegado .menu-tg .lbl{display:none}
.app.menu-plegado nav{padding-inline:6px}
.app.menu-plegado nav a{justify-content:center;padding:9px 0}
.app.menu-plegado nav a.sub{padding-left:0;opacity:.7}
.app.menu-plegado nav .ic{font-size:14px;opacity:1}
.app.menu-plegado .menu-tg{margin-inline:6px;padding-inline:0}
main{min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-inline:24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
#topbtn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.5}.crumbs .cur{color:var(--ink);font-weight:500}
#view{padding-block:22px;padding-inline:24px;max-width:1240px;width:100%}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .meta{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.design{background:var(--design);border-color:var(--design);color:var(--design-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols.w{grid-template-columns:3fr 2fr}
@media (max-width:900px){.cols,.cols.w{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.design-bar{background:var(--design-soft);border:1px solid var(--design);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;font-size:13px}
.design-bar b{color:var(--design);text-transform:uppercase;letter-spacing:.08em;font-size:11px;white-space:nowrap}
/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.fld label .req{color:var(--bad)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
.fld textarea{min-height:72px;resize:vertical}
.fld .help{font-size:11.5px;color:var(--muted)}
.fld .opts{display:flex;gap:12px;flex-wrap:wrap;padding-top:4px}
.fld .opts label{font-weight:400;color:var(--ink);display:flex;gap:5px;align-items:center;font-size:13px}
.fld.hidden{display:none}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td a{text-decoration:none;font-weight:500}
.group-row td{background:var(--panel2);font-weight:600;padding-block:6px}
/* tree */
.tree ul{list-style:none;margin:0;padding-left:18px;position:relative}
.tree ul::before{content:'';position:absolute;left:7px;top:0;bottom:0;border-left:1px solid var(--line)}
.tree li{position:relative;margin:0}
.tree li::before{content:'';position:absolute;left:-11px;top:14px;width:11px;border-top:1px solid var(--line)}
.tree li:last-child::after{content:'';position:absolute;left:-11px;top:15px;bottom:0;width:1px;background:var(--panel)}
.tree>ul{padding-left:0}
.tree>ul::before,.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree .row{display:flex;align-items:center;gap:5px;padding:4px 4px 4px 2px;border-radius:6px;font-size:13px;min-height:28px}
.tree .row:hover{background:var(--panel2)}
.tree .row a{text-decoration:none;color:var(--ink);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tree .row.cur{background:color-mix(in srgb,var(--accent-soft),var(--accent) 25%)}
.tree .row.cur a{color:var(--accent);font-weight:600}
.tree .tg{flex:none;width:14px;color:var(--muted);font-size:11px}
.tree .fin{display:flex;align-items:center;gap:6px;flex:none}
.tree .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.tree .cnt{font-size:11px;color:var(--muted)}
.tree .acts{display:none;gap:2px;flex:none;margin-left:4px}
.tree .row:hover .acts,.tree .row.cur .acts{display:flex}
.tree .act{border:0;background:transparent;color:var(--muted);padding:0 5px;border-radius:4px;font-size:13px;line-height:18px}
.tree .act:hover{background:var(--panel);color:var(--accent)}
.tree .act.del:hover{color:var(--bad)}
.tree .exp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px 8px;margin-bottom:6px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tree .exp-head b{color:var(--ink);font-weight:600;white-space:nowrap}
.tree .exp-head a.act{text-decoration:none}
.tree .exp-acts{display:flex;gap:2px;align-items:center}
.tree .exp-head .act{border:0;background:transparent;color:var(--accent);font-size:15px;line-height:16px;padding:0 5px;border-radius:4px}
.tree .exp-head .act:hover{background:var(--accent-soft)}
#popm{position:fixed;z-index:40;display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:4px;min-width:150px}
#popm button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:4px;font-size:13px}
#popm button:hover{background:var(--panel2)}
.nodo-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.nodo-layout.sin-arbol{grid-template-columns:minmax(0,1fr)}
.explorador{position:sticky;top:62px;max-height:calc(100vh - 84px);overflow:auto;padding:10px 8px}
.explorador .fin{margin-left:auto}
@media (max-width:900px){.nodo-layout{grid-template-columns:minmax(0,1fr)}.explorador{position:static;max-height:240px}}
/* designer rows */
.drow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .mv{display:flex;flex-direction:column;gap:2px}
.drow .mv button{padding:0 6px;font-size:11px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;line-height:18px}
.drow .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.drow .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drow input[type=text],.drow select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 7px;font-size:13px}
.drow input.lbl{font-weight:500;min-width:200px;flex:1}
.drow .k{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.drow label.cb{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.drow.off{opacity:.55}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.5}
.note{font-size:12.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.list li:last-child{border-bottom:0}
.list a.item{text-decoration:none;font-weight:500;color:var(--ink)}
.list a.item.on{color:var(--accent)}
.hist{font-size:13px}.hist .t{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
.q{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:10px;font-weight:600;margin-left:5px;cursor:help;vertical-align:middle;line-height:1;flex:none;font-family:var(--sans);text-transform:none;letter-spacing:0}
.q:hover,.q:focus{border-color:var(--accent);color:var(--accent);outline:none}
#tip{position:fixed;z-index:50;display:none;background:var(--ink);color:var(--bg);padding:10px 13px;border-radius:6px;font-size:12.5px;line-height:1.5;box-shadow:var(--shadow);white-space:pre-line;pointer-events:none;font-weight:400;font-family:var(--sans);text-transform:none;letter-spacing:0;text-align:left}
#tip b{color:var(--design)}
.hint{font-size:12px;color:var(--muted);background:var(--panel2);border-left:3px solid var(--line);padding:5px 9px;border-radius:0 4px 4px 0;flex-basis:100%}
.hint b{color:var(--ink)}
.glos dt{font-weight:600;margin-top:12px}.glos dd{margin:2px 0 0 0;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;vertical-align:middle}
.tag.fijo{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.def{background:var(--design-soft);color:var(--design)}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
@media (max-width:760px){.app,.app.menu-plegado{grid-template-columns:1fr}.menu-tg{display:none}.app.menu-plegado nav a .lbl,.app.menu-plegado .side-foot,.app.menu-plegado nav .grp,.app.menu-plegado .brand span{display:initial}.app.menu-plegado nav a{justify-content:flex-start;padding:7px 10px}nav .ic.alt{visibility:hidden}aside{flex-direction:row;flex-wrap:wrap;padding-block:8px}nav{flex-direction:row;flex-wrap:wrap}nav .grp{width:100%;padding-top:6px}.brand{border:0}.side-foot{border:0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="app">
  <aside>
    <div class="brand"><b>SisPla</b><span>Proyectos multinivel · demo</span></div>
    <nav id="nav"></nav>
    <button class="menu-tg" id="menutg" onclick="A.menuToggle()"></button>
    <div class="side-foot">Todo lo que ves se genera desde el JSON de definición. Los cambios se guardan en este navegador.<br><a href="#/ayuda" style="color:var(--side-ink)">Ayuda y glosario</a><br><button onclick="A.reset()" data-tip="Borra todo lo que hayas cambiado en este navegador (datos y definiciones) y vuelve al ejemplo inicial de la demo. No afecta a nadie más: la demo vive solo en tu navegador.">Restablecer demo</button></div>
  </aside>
  <main>
    <header><div class="crumbs" id="crumbs"></div><div id="topbtn"></div></header>
    <section id="view"></section>
  </main>
</div>
<div id="toast"></div>

<script>
/* ============ estado ============ */
const LS='sispla-demo-v1';
const uid=()=>'n'+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>(String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''))||'campo';
const hoy=()=>new Date().toISOString().slice(0,10);
/* ---- Vocabulario fijo del sistema (viene programado; no se define desde las pantallas) ---- */
const TIPOS_CAMPO={texto:'Texto',textolargo:'Texto largo',numero:'Número',fecha:'Fecha',lista:'Lista desplegable',radio:'Botones de opción',checkbox:'Casilla (sí/no)',multiple:'Selección múltiple',referencia:'Referencia a otro nodo',archivo:'Archivo adjunto'};
const TIPOS_CAMPO_DESC={
 texto:'Una sola línea de texto libre: nombres, códigos, correos, montos con formato propio.',
 textolargo:'Varias líneas de texto: descripciones, observaciones, alcance.',
 numero:'Solo admite números. En los reportes, al agrupar, los campos numéricos se suman solos.',
 fecha:'Un selector de calendario. Se guarda como AAAA-MM-DD, lo que permite ordenar y filtrar por fecha.',
 lista:'Un desplegable donde se elige UNA opción. Las opciones vienen de una "Lista de opciones" compartida (recomendado) o se escriben en el propio campo.',
 radio:'Igual que la lista desplegable, pero todas las opciones se ven a la vez y se marca una sola (botones de opción). Conviene cuando hay 2 a 5 opciones.',
 checkbox:'Una única casilla sí/no. Se guarda como verdadero o falso. En una condición "mostrar solo si" se compara con el texto true o false.',
 multiple:'Varias casillas de las que se pueden marcar varias a la vez. Se guarda como lista de valores (por ejemplo ["planos","acta"]).',
 referencia:'Un desplegable con los nodos que ya existen en el árbol (por ejemplo, la tarea de la que depende esta). Guarda el identificador del nodo elegido y se muestra como enlace.',
 archivo:'Un lugar dentro de la ficha para adjuntar uno o más archivos con un significado concreto ("Contrato firmado", "Acta de entrega"). Los archivos se guardan en la colección de archivos con la clave de este campo, y también se ven en la pestaña Archivos del nodo. Admite condiciones "mostrar solo si" como cualquier campo.'
};
const MENU_TIPOS={
 arbol:{label:'Árbol de proyectos',desc:'Abre la vista principal: el árbol con todos los proyectos y todo lo que contienen. No necesita destino.'},
 lista:{label:'Listado de un tipo',desc:'Muestra en una tabla todos los nodos de un tipo (por ejemplo, todas las tareas) sin importar en qué nivel del árbol estén. El destino es uno de los tipos definidos por ustedes en "Tipos de nodo".'},
 reportes:{label:'Lista de reportes',desc:'Abre la pantalla con todos los reportes definidos. No necesita destino.'},
 reporte:{label:'Un reporte',desc:'Ejecuta directamente un reporte concreto. El destino es uno de los reportes definidos por ustedes en "Reportes".'},
 config:{label:'Pantalla de configuración',desc:'Abre una de las pantallas de diseño del sistema (Pantallas, Tipos de nodo, Listas de opciones, Menú, JSON, Ayuda). Estas pantallas vienen fijas con el sistema; desde el menú solo se decide dónde aparecen y con qué nombre.'},
 url:{label:'Enlace externo',desc:'Abre una dirección web en otra pestaña, por ejemplo la intranet del cliente o un tablero externo. El destino es la URL completa (https://…).'},

/* Genera proyectos de ejemplo de forma determinista (misma semilla → mismos datos) */
function genNodos(){
 let s=20260911;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const pick=a=>a[Math.floor(rnd()*a.length)];const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
 const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
 const fr=(base,dias)=>{const d=new Date(base+'T00:00:00');d.setDate(d.getDate()+dias);return d.toISOString().slice(0,10)};
 /* Los primeros 9 nombres (y sus sponsor / project manager) son los del SISPLA actual de la AIG; los demás son inventados en el mismo rubro */
 const NOMBRES=[['Sin Especificar','sin_especificar','sin_especificar'],['Recursos Humanos','oirh','oirh'],['Interoperabilidad y Bus de Servicio','dici','dici'],['Medición','dici','dici'],['Plan contra Desastre e Inventario','dti','dti'],['Digitalización','despacho_superior','ciencias_informacion'],['Transporte','director','director'],['Hub de Datos','direccion_ciencias_informacion','director'],['Ciberseguridad','director','director'],
  ['Firma Electrónica','di','di'],['Portal de Trámites en Línea','dici','di'],['Nube Gubernamental','dti','dti'],['Identidad Digital','despacho_superior','dici'],['Centro de Datos','dti','director'],['Mesa de Ayuda','dti','dti'],['Gestión Documental','director','dici'],['Correo Institucional','dti','dti'],['Inventario de Activos TI','dti','dti'],['Capacitación en Ciberseguridad','oirh','director'],['Telefonía IP','dti','dti'],['Red Nacional Multiservicios','dici','dti'],['Panamá Digital','despacho_superior','director']];
 const CLIENTES=['AIG','Ministerio de Economía y Finanzas','Caja de Seguro Social','Registro Público','Tribunal Electoral','Ministerio de Salud','Autoridad del Canal','Municipio de Panamá','Contraloría General','Ministerio de Educación'];
 const ETAPAS=['Levantamiento de requerimientos','Diseño','Desarrollo','Pruebas','Capacitación','Puesta en producción','Cierre','Adquisiciones','Análisis de riesgos'];
 const SUBETAPAS=['Módulo de seguridad','Integración con entidades','Migración de datos','Interfaz de usuario','Infraestructura'];
 const TAREAS=['Acta de reunión con el sponsor','Informe mensual de avance','Revisión de casos de uso','Configuración de servidores','Pruebas de aceptación','Capacitación a usuarios','Solicitud de cambio N° 3','Respaldo y plan de contingencia','Documentación técnica','Gestión de accesos','Validación con la entidad','Publicación en producción','Análisis de vulnerabilidades','Elaboración de manual de usuario'];
 const SUBPROY=['Portal ciudadano','App móvil','Mesa de ayuda','Integración con entidades'];
 const RESP=['M. Quispe','L. Paredes','A. Torres','R. Huamán','S. Beltrán','C. Vega','J. Ríos','P. Salazar'];
 const UNIDADES=['di','oirh','dici','dti','despacho_superior','ciencias_informacion','director','direccion_ciencias_informacion'];
 const ESTADOS=['planificado','en_curso','en_curso','en_espera','cerrado'];const AREAS=['obra_civil','electrico','legal','administrativo'];const ENTREG=['informe','planos','acta','presupuesto'];
 const out=[];
 const dProy=(inicio,sponsor,pm)=>{const tc=rnd()<0.7;const fin=fr(inicio,ri(60,360));return{sponsor:sponsor||pick(UNIDADES),project_manager:pm||pick(UNIDADES),cliente:pick(CLIENTES),estado:pick(ESTADOS),responsable:pick(RESP),area:pick(AREAS),fecha_inicio:inicio,fecha_fin:fin,presupuesto:ri(20,900)*2500,tiene_contrato:tc,nro_contrato:tc?`CT-2026-${String(ri(1,99)).padStart(3,'0')}`:'',descripcion:''}};
 const dEtapa=(inicio)=>{const e=pick(ESTADOS);return{estado:e,avance:e==='cerrado'?100:e==='planificado'?0:ri(5,95),fecha_inicio:inicio,fecha_fin:fr(inicio,ri(20,120)),entregables:shuffle(ENTREG).slice(0,ri(1,3)),observaciones:''}};
 const dTarea=(inicio)=>({estado:pick(ESTADOS),prioridad:pick(['alta','media','baja']),responsable:pick(RESP),fecha_limite:fr(inicio,ri(5,60)),horas:ri(2,80),notas:''});
 const tareas=(parent,codigo,inicio,n)=>{shuffle(TAREAS).slice(0,n).forEach((nom,i)=>out.push({id:uid(),tipo:'tarea',parentId:parent,codigo:`${codigo}.${i+1}`,nombre:nom,creado:inicio,datos:dTarea(inicio)}))};
 NOMBRES.forEach(([nombre,sponsor,pm],i)=>{
  const num=i+2,pid='g'+num,codigo='PRJ-'+String(num).padStart(3,'0'),inicio=fr('2026-01-05',ri(0,240));
  out.push({id:pid,tipo:'proyecto',parentId:null,codigo,nombre,creado:inicio,datos:dProy(inicio,sponsor,pm)});
  const n=ri(3,6),etapas=shuffle(ETAPAS);let ie=0;
  for(let j=1;j<=n;j++){
   const cod=`${codigo}.${j}`,r=rnd(),ini=fr(inicio,j*ri(10,40));
   if(r<0.12){const sid=uid();out.push({id:sid,tipo:'proyecto',parentId:pid,codigo:cod,nombre:pick(SUBPROY),creado:ini,datos:dProy(ini)});tareas(sid,cod,ini,ri(1,2))}
   else if(r<0.28){out.push({id:uid(),tipo:'tarea',parentId:pid,codigo:cod,nombre:pick(TAREAS),creado:ini,datos:dTarea(ini)})}
   else{const eid=uid();out.push({id:eid,tipo:'etapa',parentId:pid,codigo:cod,nombre:etapas[ie++%etapas.length],creado:ini,datos:dEtapa(ini)});
    let k=0;if(rnd()<0.3){const sub=uid();k++;out.push({id:sub,tipo:'etapa',parentId:eid,codigo:`${cod}.1`,nombre:pick(SUBETAPAS),creado:ini,datos:dEtapa(ini)});tareas(sub,`${cod}.1`,ini,ri(1,2))}
    const nt=ri(0,3);shuffle(TAREAS).slice(0,nt).forEach(nom=>{k++;out.push({id:uid(),tipo:'tarea',parentId:eid,codigo:`${cod}.${k}`,nombre:nom,creado:ini,datos:dTarea(ini)})})}
  }
 });
 return out;
}

let S;

function load(){try{const r=localStorage.getItem(LS);S=r?JSON.parse(r):seed()}catch(e){S=seed()}
 /* migraciones: conservan las definiciones del usuario y ajustan solo lo necesario */
 const v=S.version||1;
 if(v<2){const sd=seed();S.datos=sd.datos;S.meta.tipos.forEach(t=>{t.archivos=t.archivos!==false});
  const tp=S.meta.tipos.find(t=>t.id==='proyecto');if(tp&&!tp.hijos.includes('tarea'))tp.hijos.push('tarea');
  const fp=S.meta.formularios.f_proyecto;if(fp&&!fp.campos.some(c=>c.key==='contrato_firmado'))fp.campos.push(sd.meta.formularios.f_proyecto.campos.find(c=>c.key==='contrato_firmado'))}
 if(v<3){S.meta.tipos.forEach(t=>{t.icono=''})}
 if(v<4){const sd=seed();S.datos=sd.datos;
  if(!S.meta.catalogos.unidades)S.meta.catalogos.unidades=sd.meta.catalogos.unidades;
  const fp=S.meta.formularios.f_proyecto;if(fp){['project_manager','sponsor'].forEach(k=>{if(!fp.campos.some(c=>c.key===k))fp.campos.unshift(sd.meta.formularios.f_proyecto.campos.find(c=>c.key===k))})}
  const tp=S.meta.tipos.find(t=>t.id==='proyecto');if(tp)tp.columnas=['sponsor','project_manager','estado'];
  const r2=S.meta.reportes.find(r=>r.id==='r2');if(r2)Object.assign(r2,sd.meta.reportes.find(r=>r.id==='r2'))}
 if(v<VERSION){S.version=VERSION;save()}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ============ tooltips ============ */
const tipEl=document.createElement('div');tipEl.id='tip';document.body.appendChild(tipEl);
const popm=document.createElement('div');popm.id='popm';document.body.appendChild(popm);document.addEventListener('click',e=>{if(!e.target.closest('#popm'))popm.style.display='none'});
function showTip(el){const t=el.getAttribute('data-tip');if(!t)return;tipEl.textContent=t;tipEl.style.display='block';const w=Math.min(380,window.innerWidth-24);tipEl.style.width=w+'px';const r=el.getBoundingClientRect();let x=r.left,y=r.bottom+8;if(x+w>window.innerWidth-12)x=window.innerWidth-12-w;if(x<12)x=12;const h=tipEl.offsetHeight;if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-8);tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
function hideTip(){tipEl.style.display='none'}
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el);else hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('.q[data-tip]');if(el)showTip(el)});
document.addEventListener('focusout',hideTip);
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.q');if(el){showTip(el);e.stopPropagation()}else hideTip()});
window.addEventListener('scroll',hideTip,true);

const form=id=>S.meta.formularios[id];
const formDeTipo=tid=>form(tipo(tid)?.formId);
const nodo=id=>S.datos.nodos.find(n=>n.id===id);
const hijos=id=>S.datos.nodos.filter(n=>n.parentId===id);
const ancestros=id=>{const out=[];let n=nodo(id);while(n&&n.parentId){n=nodo(n.parentId);if(n)out.unshift(n)}return out};
const rutaStr=id=>ancestros(id).map(n=>n.nombre).join(' › ');
const desc=id=>{const out=[];const rec=p=>hijos(p).forEach(h=>{out.push(h);rec(h.id)});rec(id);return out};
const archivosDe=id=>S.datos.archivos.filter(a=>a.nodoId===id);
function opciones(f){if(f.catalogo&&S.meta.catalogos[f.catalogo])return S.meta.catalogos[f.catalogo].opciones;return f.opciones||[]}
function etiquetaOpcion(f,v){const o=opciones(f).find(o=>o.valor===v);return o?o:{valor:v,etiqueta:v}}
function campoDe(tid,key){return formDeTipo(tid)?.campos.find(c=>c.key===key)}
function fmtNum(n){return Number(n).toLocaleString('es-PE')}
function fmtBytes(b){return b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB'}
function chip(f,v){const o=etiquetaOpcion(f,v);return `<span class="chip"><i style="background:${esc(o.color||'var(--muted)')}"></i>${esc(o.etiqueta)}</span>`}
const archivosCampo=(nodoId,key)=>S.datos.archivos.filter(a=>a.nodoId===nodoId&&a.campoKey===key);
function mostrarValor(f,v,n){
 if(f.tipo==='archivo'){const k=n?archivosCampo(n.id,f.key).length:0;return k?`${k} archivo${k>1?'s':''}`:'<span class="note">—</span>'}
 if(v===undefined||v===null||v==='')return '<span class="note">—</span>';
 switch(f.tipo){
  case 'lista':case 'radio':return chip(f,v);
  case 'multiple':return (Array.isArray(v)?v:[v]).map(x=>chip(f,x)).join(' ');
  case 'checkbox':return v?'Sí':'No';
  case 'numero':return fmtNum(v);
  case 'referencia':{const n=nodo(v);return n?`<a href="#/nodo/${n.id}">${esc(n.nombre)}</a>`:esc(v)}
  default:return esc(v);
 }}

/* ============ formulario dinámico ============ */
function renderForm(f,data,pre='c_',nodoId){
 return `<div class="form-grid" id="dynform">`+f.campos.filter(c=>c.visible!==false).map(c=>{
  const id=pre+c.key,v=data[c.key];let ctl='';
  const at=`id="${id}" name="${c.key}"`;
  switch(c.tipo){
   case 'archivo':{const as=nodoId?archivosCampo(nodoId,c.key):[];
    ctl=`<div class="opts" style="flex-direction:column;align-items:flex-start;gap:6px">${as.map(a=>`<span class="chip" data-tip="${esc(`Archivo adjuntado desde el campo "${c.label}". También figura en la pestaña Archivos.`)}">📎 ${esc(a.nombre)} <span class="note">· ${fmtBytes(a.tamano)} · ${esc(a.fecha)}</span> <button class="btn ghost sm" onclick="A.borrarArchivo('${a.id}')" style="padding:0 4px" data-tip="Quita este archivo del campo.">✕</button></span>`).join('')}${nodoId?`<label class="btn sm" data-tip="Adjunta un archivo a este campo. Se registra de inmediato (no hace falta pulsar Guardar) y queda anotado en el historial. En la demo solo se registran nombre y tamaño.">＋ Adjuntar archivo <input type="file" ${at} style="display:none" onchange="A.adjuntarCampo('${nodoId}','${c.key}',this)"></label>`:`<span class="note">(aquí el usuario adjunta archivos; se muestran como chips)</span>`}</div>`;break}
   case 'textolargo':ctl=`<textarea ${at}>${esc(v)}</textarea>`;break;
   case 'numero':ctl=`<input type="number" ${at} value="${esc(v)}">`;break;
   case 'fecha':ctl=`<input type="date" ${at} value="${esc(v)}">`;break;
   case 'lista':ctl=`<select ${at}><option value="">— elegir —</option>${opciones(c).map(o=>`<option value="${esc(o.valor)}" ${o.valor===v?'selected':''}>${esc(o.etiqueta)}</option>`).join('')}</select>`;break;
   case 'radio':ctl=`<div class="opts">${opciones(c).map((o,i)=>`<label><input type="radio" name="${c.key}" id="${id}_${i}" value="${esc(o.valor)}" ${o.valor===v?'checked':''}>${esc(o.etiqueta)}</label>`).join('')}</div>`;break;
   case 'multiple':{const arr=Array.isArray(v)?v:[];ctl=`<div class="opts">${opciones(c).map((o,i)=>`<label><input type="checkbox" name="${c.key}" id="${id}_${i}" value="${esc(o.valor)}" ${arr.includes(o.valor)?'checked':''}>${esc(o.etiqueta)}</label>`).join('')}</div>`;break}
   case 'checkbox':ctl=`<div class="opts"><label><input type="checkbox" ${at} ${v?'checked':''}>Sí</label></div>`;break;
   case 'referencia':{const ns=S.datos.nodos.filter(n=>!c.refTipo||n.tipo===c.refTipo);ctl=`<select ${at}><option value="">— ninguno —</option>${ns.map(n=>`<option value="${n.id}" ${n.id===v?'selected':''}>${esc(n.codigo)} · ${esc(n.nombre)}</option>`).join('')}</select>`;break}
   default:ctl=`<input type="text" ${at} value="${esc(v)}">`;
  }
  const tipCampo=`Campo "${c.label}" · tipo: ${TIPOS_CAMPO[c.tipo]||c.tipo} · clave interna: ${c.key}${c.requerido?' · requerido':''}${c.visibleSi?.campo?` · se muestra solo si ${c.visibleSi.campo} = ${c.visibleSi.valor}`:''}.\n${TIPOS_CAMPO_DESC[c.tipo]||''}\n\nEste campo no está programado: está definido en la pantalla "${f.nombre}". Se agrega, cambia o quita con el botón ámbar "Diseñar esta pantalla".${c.ayuda?'\n\nAyuda del campo: '+c.ayuda:''}`;
  return `<div class="fld ${c.ancho==='full'?'full':'half'}" data-key="${c.key}"><label for="${id}" data-tip="${esc(tipCampo)}">${esc(c.label)}${c.requerido?' <span class="req" data-tip="Campo requerido: no se puede guardar la ficha si está vacío.">*</span>':''}</label>${ctl}${c.ayuda?`<div class="help">${esc(c.ayuda)}</div>`:''}</div>`;
 }).join('')+`</div>`;
}
function leerForm(f){
 const root=document.getElementById('dynform');if(!root)return {};const out={};
 f.campos.filter(c=>c.visible!==false&&c.tipo!=='archivo').forEach(c=>{
  if(c.tipo==='radio'){const r=root.querySelector(`input[name="${c.key}"]:checked`);out[c.key]=r?r.value:''}
  else if(c.tipo==='multiple'){out[c.key]=[...root.querySelectorAll(`input[name="${c.key}"]:checked`)].map(i=>i.value)}
  else if(c.tipo==='checkbox'){out[c.key]=!!root.querySelector(`[name="${c.key}"]`)?.checked}
  else if(c.tipo==='numero'){const v=root.querySelector(`[name="${c.key}"]`)?.value;out[c.key]=v===''?'':Number(v)}
  else out[c.key]=root.querySelector(`[name="${c.key}"]`)?.value??'';
 });return out;
}
function aplicarCondiciones(f){
 const root=document.getElementById('dynform');if(!root)return;
 const ev=()=>{const vals=leerForm(f);f.campos.forEach(c=>{if(!c.visibleSi||!c.visibleSi.campo)return;const el=root.querySelector(`.fld[data-key="${c.key}"]`);if(!el)return;const v=vals[c.visibleSi.campo];const ok=String(Array.isArray(v)?v.includes(c.visibleSi.valor):v)===String(c.visibleSi.valor);el.classList.toggle('hidden',!ok)})};
 root.addEventListener('input',ev);root.addEventListener('change',ev);ev();
}

  <select id="mt_${m.id}" onchange="A.mSet(${i},'tipo',this.value,true)" aria-label="Tipo de opción" data-tip="${esc('Tipo actual: '+MENU_TIPOS[m.tipo].label+' — '+MENU_TIPOS[m.tipo].desc+'\n\n'+TIP.mTipo)}">${Object.entries(MENU_TIPOS).map(([k,v])=>`<option value="${k}" ${m.tipo===k?'selected':''}>${v.label}</option>`).join('')}</select>

/* ============ reportes ============ */
function vReportes(){
 setTop(`<span class="cur">Reportes</span>`);
 view(`<div class="page-head"><div><h1>Reportes ${q('Los reportes definidos por ustedes. Cada uno es un documento JSON (tipo de nodo, alcance, columnas, filtro, agrupación) del que el sistema genera la consulta. No hay reportes programados uno por uno.')}</h1><div class="meta">Cada reporte es una definición JSON: tipo de nodo, alcance, campos, filtro y agrupación. De ahí se genera la consulta.</div></div><button class="btn pri" onclick="A.rNuevo()" data-tip="${esc(TIP.rNuevo)}">+ Nuevo reporte</button></div>
 <div class="card"><ul class="list">${S.meta.reportes.map(r=>`<li><div><a class="item" href="#/reporte/${r.id}">${esc(r.nombre)}</a><div class="note">${esc(tipo(r.tipo)?.nombre||r.tipo)}s${r.agrupar?` · agrupado por ${esc(campoDe(r.tipo,r.agrupar)?.label||r.agrupar)}`:''}</div></div><div><a class="btn sm" href="#/reporte/${r.id}" data-tip="Corre el reporte con los datos actuales y muestra la tabla.">Ejecutar</a> <a class="btn sm design" href="#/reporte/${r.id}/design" data-tip="${esc(TIP.rDisenar)}">Diseñar</a></div></li>`).join('')}</ul></div>`);
}
function ejecutarReporte(r){
 let ns=S.datos.nodos.filter(n=>n.tipo===r.tipo);
 if(r.alcance){const ids=new Set(desc(r.alcance).map(n=>n.id));ns=ns.filter(n=>ids.has(n.id))}
 if(r.filtro?.campo&&r.filtro.valor!==''){ns=ns.filter(n=>{const v=n.datos[r.filtro.campo];return Array.isArray(v)?v.includes(r.filtro.valor):String(v??'')===String(r.filtro.valor)})}
 const grupos={};ns.forEach(n=>{const g=r.agrupar?String(n.datos[r.agrupar]??'(sin valor)'):'';(grupos[g]=grupos[g]||[]).push(n)});
 return {ns,grupos};
}
function pipelineMongo(r){
 const match={tipo:r.tipo};if(r.alcance)match.path=r.alcance;if(r.filtro?.campo&&r.filtro.valor!=='')match['datos.'+r.filtro.campo]=r.filtro.valor;
 const project={};r.campos.forEach(k=>project[['nombre','codigo','ruta'].includes(k)?k:'datos.'+k]=1);
 const p=[{$match:match},{$project:project}];
 if(r.agrupar){const g={_id:'$datos.'+r.agrupar,total:{$sum:1},filas:{$push:'$$ROOT'}};formDeTipo(r.tipo)?.campos.filter(c=>c.tipo==='numero'&&r.campos.includes(c.key)).forEach(c=>g['suma_'+c.key]={$sum:'$datos.'+c.key});p.push({$group:g},{$sort:{_id:1}})}
 return JSON.stringify(p,null,2);
}
function vReporte(rid,mode){
 const r=S.meta.reportes.find(x=>x.id===rid);if(!r){location.hash='#/reportes';return}
 const f=formDeTipo(r.tipo);const design=mode==='design';
 setTop(`<a href="#/reportes">Reportes</a><span class="sep">›</span><span class="cur">${esc(r.nombre)}</span>`,design?`<a class="btn" href="#/reporte/${rid}" data-tip="Cierra el panel de definición y muestra solo el resultado.">← Ejecutar</a>`:designBtn(`#/reporte/${rid}/design`,'Diseñar este reporte',TIP.rDisenar));
 const base=[{key:'codigo',label:'Código'},{key:'nombre',label:'Nombre'},{key:'ruta',label:'Ubicación'}];
 const cols=r.campos.map(k=>base.find(b=>b.key===k)||f?.campos.find(c=>c.key===k)).filter(Boolean);
 const {ns,grupos}=ejecutarReporte(r);
 const celda=(n,c)=>{if(c.key==='codigo')return `<td class="code">${esc(n.codigo)}</td>`;if(c.key==='nombre')return `<td><a href="#/nodo/${n.id}">${esc(n.nombre)}</a></td>`;if(c.key==='ruta')return `<td class="note">${esc(rutaStr(n.id))}</td>`;return `<td class="${c.tipo==='numero'?'num':''}">${mostrarValor(c,n.datos[c.key],n)}</td>`};
 const numCols=cols.filter(c=>c.tipo==='numero');
 const filas=Object.entries(grupos).map(([g,arr])=>{const fg=campoDe(r.tipo,r.agrupar);const head=r.agrupar?`<tr class="group-row"><td colspan="${cols.length}">${fg?mostrarValor(fg,g==='(sin valor)'?'':g):esc(g)} <span class="note">· ${arr.length} registro${arr.length!==1?'s':''}${numCols.map(c=>` · ${esc(c.label)}: ${fmtNum(arr.reduce((s,n)=>s+(Number(n.datos[c.key])||0),0))}`).join('')}</span></td></tr>`:'';return head+arr.map(n=>`<tr>${cols.map(c=>celda(n,c)).join('')}</tr>`).join('')}).join('');
 const dsg=design?`<div class="card"><h3>Definición ${q('Todo lo que define el reporte. Las alternativas de columnas, filtro y agrupación salen de la ficha del tipo elegido: si agregan un campo a la ficha, aparece aquí sin programar nada.')}</h3><div class="form-grid">
  <div class="fld half"><label for="rn">Nombre ${q(TIP.rNombre)}</label><input type="text" id="rn" value="${esc(r.nombre)}" oninput="A.rSet('${rid}','nombre',this.value)" data-tip="${esc(TIP.rNombre)}"></div>
  <div class="fld half"><label for="rt">Tipo de nodo ${q(TIP.rTipo)}</label><select id="rt" onchange="A.rSet('${rid}','tipo',this.value,true)" data-tip="${esc(TIP.rTipo)}">${S.meta.tipos.map(t=>`<option value="${t.id}" ${t.id===r.tipo?'selected':''}>${esc(t.nombre)}</option>`).join('')}</select></div>
  <div class="fld half"><label for="ra">Alcance (solo debajo de…) ${q(TIP.rAlcance)}</label><select id="ra" onchange="A.rSet('${rid}','alcance',this.value,true)" data-tip="${esc(TIP.rAlcance)}"><option value="">Todo el sistema</option>${S.datos.nodos.filter(n=>hijos(n.id).length).map(n=>`<option value="${n.id}" ${n.id===r.alcance?'selected':''}>${esc(n.codigo)} · ${esc(n.nombre)}</option>`).join('')}</select></div>
  <div class="fld half"><label for="rg">Agrupar por ${q(TIP.rAgrupar)}</label><select id="rg" onchange="A.rSet('${rid}','agrupar',this.value,true)" data-tip="${esc(TIP.rAgrupar)}"><option value="">(sin agrupar)</option>${(f?.campos||[]).filter(c=>['lista','radio','checkbox','texto'].includes(c.tipo)).map(c=>`<option value="${c.key}" ${c.key===r.agrupar?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div>
  <div class="fld half"><label for="rfc">Filtrar: campo ${q(TIP.rFiltroCampo)}</label><select id="rfc" onchange="A.rFiltro('${rid}','campo',this.value,true)" data-tip="${esc(TIP.rFiltroCampo)}"><option value="">(sin filtro)</option>${(f?.campos||[]).map(c=>`<option value="${c.key}" ${c.key===r.filtro?.campo?'selected':''}>${esc(c.label)}</option>`).join('')}</select></div>
  <div class="fld half"><label for="rfv">Filtrar: valor ${q(TIP.rFiltroValor)}</label>${(()=>{const fc=f?.campos.find(c=>c.key===r.filtro?.campo);if(fc&&['lista','radio','multiple'].includes(fc.tipo))return `<select id="rfv" onchange="A.rFiltro('${rid}','valor',this.value,true)" data-tip="${esc(TIP.rFiltroValor)}"><option value="">— cualquiera —</option>${opciones(fc).map(o=>`<option value="${esc(o.valor)}" ${o.valor===r.filtro.valor?'selected':''}>${esc(o.etiqueta)}</option>`).join('')}</select>`;return `<input type="text" id="rfv" value="${esc(r.filtro?.valor||'')}" oninput="A.rFiltro('${rid}','valor',this.value)" ${fc?'':'disabled'} data-tip="${esc(TIP.rFiltroValor)}">`})()}</div>
  <div class="fld full"><label>Columnas ${q(TIP.rCols)}</label><div class="opts">${base.concat(f?.campos||[]).map(c=>`<label data-tip="${esc(base.some(b=>b.key===c.key)?`"${c.label}" es una columna fija del sistema: la tiene todo nodo, sea del tipo que sea.`:`"${c.label}" es un campo de la ficha de ${tipo(r.tipo)?.nombre||r.tipo} (tipo ${TIPOS_CAMPO[c.tipo]||c.tipo}).`)}"><input type="checkbox" id="rc_${c.key}" ${r.campos.includes(c.key)?'checked':''} onchange="A.rCol('${rid}','${c.key}',this.checked)">${esc(c.label)}${base.some(b=>b.key===c.key)?' <span class="tag fijo">fijo</span>':''}</label>`).join('')}</div></div></div>
  <div class="actions"><button class="btn danger" onclick="A.rDel('${rid}')" data-tip="${esc(TIP.rEliminar)}">Eliminar reporte</button><a class="btn pri" href="#/reporte/${rid}">Ver resultado</a></div></div>`:'';
 view((design?designBar('Un reporte se define eligiendo tipo, alcance, columnas, filtro y agrupación. Abajo se ve el resultado y la consulta generada.'):'')+`<div class="page-head"><div><h1>${esc(r.nombre)}</h1><div class="meta">${ns.length} ${esc(tipo(r.tipo)?.nombre.toLowerCase()||'')}s${r.alcance?` debajo de <a href="#/nodo/${r.alcance}">${esc(nodo(r.alcance)?.nombre||'')}</a>`:''}${r.filtro?.campo&&r.filtro.valor!==''?` · filtro ${esc(campoDe(r.tipo,r.filtro.campo)?.label||r.filtro.campo)} = ${esc(r.filtro.valor)}`:''}</div></div><div><button class="btn" onclick="A.copiar(document.getElementById('rtbl').innerText,'Tabla copiada')" data-tip="${esc(TIP.rCopiar)}">Copiar tabla</button></div></div>
 <div class="stack">${dsg}<div class="card tbl-wrap"><table id="rtbl"><thead><tr>${cols.map(c=>`<th class="${c.tipo==='numero'?'num':''}">${esc(c.label)}${c.key==='ruta'?' '+q(TIP.ubicacion):c.key==='codigo'?' '+q(TIP.codigo):''}</th>`).join('')}</tr></thead><tbody>${filas||`<tr><td colspan="${cols.length||1}" class="empty">Sin resultados.</td></tr>`}</tbody></table></div>
 <div class="cols"><div class="card"><h3>Definición del reporte (JSON) ${q(TIP.rDef)}</h3><pre>${esc(JSON.stringify(r,null,2))}</pre></div><div class="card"><h3>Consulta que se generaría en MongoDB ${q(TIP.rPipe)}</h3><pre>${esc(pipelineMongo(r))}</pre><div class="note" style="margin-top:8px">La definición se traduce a un <i>aggregation pipeline</i>. El alcance usa el campo <span class="code">path</span> (ruta materializada de ancestros) para tomar todo un subárbol en una sola consulta.</div></div></div></div>`);
}

/* ============ JSON del sistema ============ */
function vJson(tab){
 tab=tab||'meta';setTop(`<span class="cur">JSON del sistema</span>`);
 const obj=tab==='datos'?S.datos:S.meta;
 view(`<div class="page-head"><div><h1>JSON del sistema</h1><div class="meta">La definición (meta) describe pantallas, tipos, listas, menú y reportes. Los datos son documentos con un objeto <span class="code">datos</span> libre, moldeado por la definición.</div></div><div><button class="btn" onclick="A.copiar(JSON.stringify(S.${tab},null,2),'JSON copiado')">Copiar</button></div></div>
 <div class="tabs"><a href="#/json/meta" class="${tab==='meta'?'on':''}" data-tip="${esc(TIP.jMeta)}">Definición (meta)</a><a href="#/json/datos" class="${tab==='datos'?'on':''}" data-tip="${esc(TIP.jDatos)}">Datos</a><a href="#/json/importar" class="${tab==='importar'?'on':''}" data-tip="${esc(TIP.jImportar)}">Importar</a></div>
 ${tab==='importar'?`<div class="card"><h2>Reemplazar la definición</h2><div class="note" style="margin-bottom:8px">Pega aquí un JSON de definición (meta) exportado de otro ambiente. Así se lleva lo diseñado con el cliente al sistema real.</div><textarea id="imp" style="width:100%;min-height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--panel)"></textarea><div class="actions"><button class="btn pri" onclick="A.importar()">Importar definición</button></div></div>`:`<div class="card"><pre>${esc(JSON.stringify(obj,null,2))}</pre></div>`}`);
}

/* ============ ayuda y glosario ============ */
function vAyuda(){
 setTop(`<span class="cur">Ayuda y glosario</span>`);
 const dl=(dic,fmt)=>Object.entries(dic).map(([k,v])=>`<dt>${esc(fmt(k,v)[0])} <span class="code">${k}</span></dt><dd>${esc(fmt(k,v)[1])}</dd>`).join('');
 view(`<div class="page-head"><div><h1>Ayuda y glosario</h1><div class="meta">Qué es cada cosa, de dónde sale y quién la define. En toda pantalla, pasa el mouse por un <span class="q" style="margin:0">?</span> o por cualquier control para ver su explicación.</div></div></div>
 <div class="stack">
 <div class="card"><h2>Dos clases de cosas</h2><div class="kv" style="row-gap:10px">
  <dt><span class="tag fijo">fijo</span></dt><dd>Viene programado en el sistema. Son los "ladrillos": los tipos de campo que existen, las clases de destino que puede abrir el menú, las pantallas de configuración, las columnas Código / Nombre / Ubicación, las clases de archivo. No se crean ni se cambian desde una pantalla; cambiarlos es trabajo de desarrollo.</dd>
  <dt><span class="tag def">definible</span></dt><dd>Lo crean ustedes usando los ladrillos, sin programar: tipos de nodo, pantallas y sus campos, listas de opciones, opciones del menú, columnas de los listados, reportes. Todo eso vive en el JSON de definición (menú › JSON del sistema › Definición) y se puede exportar e importar.</dd></div></div>
 <div class="card glos"><h2>Conceptos <span class="tag def">definibles</span></h2><dl style="margin:0">
  <dt>Nodo</dt><dd>Cualquier elemento del árbol: un proyecto, una etapa, una tarea o lo que ustedes definan. Todos se guardan igual: tipo, padre, código, nombre y un objeto "datos" libre que la pantalla del tipo moldea.</dd>
  <dt>Tipo de nodo</dt><dd>${esc(TIP.tipoNodo)}</dd>
  <dt>Pantalla (formulario)</dt><dd>La lista ordenada de campos con que se edita un tipo de nodo. Cada campo tiene etiqueta, clave interna, tipo de campo, y opciones como requerido, visible, ancho, ayuda y condición.</dd>
  <dt>Clave interna (key)</dt><dd>${esc(TIP.dsgKey)}</dd>
  <dt>Lista de opciones</dt><dd>Catálogo de valores con etiqueta, valor interno y color, compartido por varios campos (Estados, Prioridades, Áreas…).</dd>
  <dt>Condición "mostrar solo si"</dt><dd>${esc(TIP.dsgCond)}</dd>
  <dt>Columnas en los listados</dt><dd>${esc(TIP.tCols)}</dd>
  <dt>Opción de menú</dt><dd>Una entrada del menú lateral: texto, ícono, tipo de opción (fijo), destino (definible), subopción, visible.</dd>
  <dt>Reporte</dt><dd>Definición JSON con tipo de nodo, alcance, columnas, filtro y agrupación. El sistema la convierte en una consulta y muestra la tabla.</dd>
  <dt>Constancia (archivo)</dt><dd>Documento o email adjunto a un nodo como evidencia de lo entregado por las partes. Dónde se pueden adjuntar es definible en dos niveles: por tipo de nodo (Tipos de nodo › "Admite archivos adjuntos" enciende la pestaña Archivos) y por campo (un campo de tipo "Archivo adjunto" dentro de la ficha, con condiciones si hace falta). Un archivo adjuntado desde un campo también aparece en la pestaña Archivos con el nombre del campo.</dd>
  <dt>Historial</dt><dd>${esc(TIP.tabHistorial)}</dd>
  <dt>Código</dt><dd>${esc(TIP.codigo)}</dd>
  <dt>Ubicación / path</dt><dd>${esc(TIP.ubicacion)}</dd></dl></div>
 <div class="card glos"><h2>Tipos de campo <span class="tag fijo">fijo</span></h2><div class="note">Los controles con que se puede construir una pantalla. Elegir uno u otro cambia cómo se captura y cómo se guarda el valor.</div><dl style="margin:0">${dl(TIPOS_CAMPO,(k,v)=>[v,TIPOS_CAMPO_DESC[k]])}</dl></div>
 <div class="card glos"><h2>Tipos de opción de menú <span class="tag fijo">fijo</span></h2><div class="note">Las clases de destino que el menú sabe abrir. El destino concreto (qué tipo, qué reporte, qué pantalla) sí es definible.</div><dl style="margin:0">${dl(MENU_TIPOS,(k,v)=>[v.label,v.desc])}</dl></div>
 <div class="card glos"><h2>Pantallas de configuración <span class="tag fijo">fijo</span></h2><div class="note">Las pantallas de diseño que trae el sistema. Una opción de menú de tipo "Pantalla de configuración" apunta a una de ellas.</div><dl style="margin:0">
  <dt>Pantallas <span class="code">formularios</span></dt><dd>Lista de todas las pantallas definidas y acceso a su diseñador.</dd>
  <dt>Tipos de nodo <span class="code">tipos</span></dt><dd>Qué clases de nodo existen, qué pantalla usa cada una, qué puede contener y qué columnas lista.</dd>
  <dt>Listas de opciones <span class="code">catalogos</span></dt><dd>Catálogos de valores compartidos.</dd>
  <dt>Menú <span class="code">menu</span></dt><dd>Orden, textos y destinos del menú lateral.</dd>
  <dt>JSON del sistema <span class="code">json</span></dt><dd>Ver, copiar e importar la definición y los datos.</dd>
  <dt>Ayuda y glosario <span class="code">ayuda</span></dt><dd>Esta pantalla.</dd></dl></div>
 <div class="card glos"><h2>Otras listas fijas</h2><dl style="margin:0">
  <dt>Clase de archivo</dt><dd>Documento o Email. Para email se piden además remitente, destinatario y asunto.</dd>
  <dt>Ancho de campo</dt><dd>Media fila o fila completa, dentro de la grilla de dos columnas de la ficha.</dd>
  <dt>Columnas base de reportes y listados</dt><dd>Código, Nombre y Ubicación: las tiene todo nodo, por eso no dependen de la pantalla.</dd></dl></div>
 </div>`);
}

/* ============ acciones ============ */
function siguienteCodigo(parentId,tid){
 if(parentId){const p=nodo(parentId);return `${p.codigo}.${hijos(parentId).length+1}`}
 const n=S.datos.nodos.filter(x=>!x.parentId).length+1;return `PRJ-${String(n).padStart(3,'0')}`;
}
function hist(nodoId,campo,antes,despues){S.datos.historial.unshift({nodoId,fecha:new Date().toISOString().slice(0,16).replace('T',' '),campo,antes,despues})}
function refresh(){route()}
const A={
 reset(){if(confirm('¿Volver a los datos y definiciones iniciales del demo?')){S=seed();save();location.hash='#/arbol';refresh();toast('Demo restablecido')}},
 copiar(txt,msg){navigator.clipboard?.writeText(txt).then(()=>toast(msg)).catch(()=>toast('No se pudo copiar'))},
 plegar(el,id,ev){if(ev&&ev.altKey){const ids=[id,...desc(id).filter(x=>hijos(x.id).length).map(x=>x.id)];if(abiertos.has(id))ids.forEach(x=>abiertos.delete(x));else ids.forEach(x=>abiertos.add(x));refresh();return}
  const ul=el.closest('li').querySelector(':scope > ul');if(!ul)return;ul.hidden=!ul.hidden;el.textContent=ul.hidden?'▸':'▾';if(ul.hidden)abiertos.delete(id);else abiertos.add(id)},
 desplegarTodo(){S.datos.nodos.forEach(n=>{if(hijos(n.id).length)abiertos.add(n.id)});refresh()},
 plegarTodo(){abiertos.clear();refresh()},
 menuToggle(){menuPlegado=!menuPlegado;try{localStorage.setItem(LS+'-menu',menuPlegado?'1':'0')}catch(e){}renderNav();hideTip()},
 arbolToggle(){arbolVisible=!arbolVisible;try{localStorage.setItem(LS+'-arbol',arbolVisible?'1':'0')}catch(e){}refresh()},
 /* nodos */
 menuNuevo(ev,parentId){ev.stopPropagation();const ts=parentId?(tipo(nodo(parentId).tipo)?.hijos||[]).map(tipo).filter(Boolean):tiposRaiz();if(!ts.length)return;if(ts.length===1)return A.nuevoNodo(parentId,ts[0].id);
  const m=popm;m.innerHTML=ts.map(t=>`<button onclick="A.nuevoNodo(${parentId?`'${parentId}'`:'null'},'${t.id}')">+ Nueva ${esc(t.nombre.toLowerCase())}</button>`).join('');m.style.display='block';const r=ev.currentTarget.getBoundingClientRect();m.style.left=Math.min(r.left,window.innerWidth-170)+'px';m.style.top=(r.bottom+4)+'px';hideTip()},
 nuevoNodo(parentId,tid){popm.style.display='none';const t=tipo(tid);const nombre=prompt(`Nombre de la nueva ${t.nombre.toLowerCase()}:`);if(!nombre)return;const n={id:uid(),tipo:tid,parentId,codigo:siguienteCodigo(parentId,tid),nombre,creado:hoy(),datos:{}};S.datos.nodos.push(n);save();location.hash='#/nodo/'+n.id;toast('Creado '+n.codigo)},
 renombrar(id){const n=nodo(id);const v=prompt('Nuevo nombre:',n.nombre);if(v&&v!==n.nombre){hist(id,'nombre',n.nombre,v);n.nombre=v;save();refresh()}},
 borrarNodo(id){const n=nodo(id);const d=desc(id);if(!confirm(`¿Eliminar "${n.nombre}"${d.length?` y sus ${d.length} internos`:''}?`))return;const ids=new Set([id,...d.map(x=>x.id)]);S.datos.nodos=S.datos.nodos.filter(x=>!ids.has(x.id));S.datos.archivos=S.datos.archivos.filter(a=>!ids.has(a.nodoId));save();const cur=(location.hash.match(/^#\/nodo\/([^/]+)/)||[])[1];if(cur&&ids.has(cur))location.hash=n.parentId?'#/nodo/'+n.parentId:'#/arbol';else refresh();toast('Eliminado')},
 guardarNodo(id){const n=nodo(id);const f=formDeTipo(n.tipo);const nuevo=leerForm(f);
  const falta=f.campos.filter(c=>c.requerido&&c.visible!==false&&!document.querySelector(`.fld[data-key="${c.key}"]`)?.classList.contains('hidden')).find(c=>{if(c.tipo==='archivo')return !archivosCampo(id,c.key).length;const v=nuevo[c.key];return v===''||v===undefined||(Array.isArray(v)&&!v.length)});
  if(falta){toast(`Falta completar: ${falta.label}`);document.getElementById('c_'+falta.key)?.focus();return}
  f.campos.forEach(c=>{const a=n.datos[c.key],b=nuevo[c.key];if(JSON.stringify(a??'')!==JSON.stringify(b??'')){const sh=v=>c.tipo==='checkbox'?(v?'Sí':'No'):Array.isArray(v)?v.join(', '):(['lista','radio'].includes(c.tipo)&&v?etiquetaOpcion(c,v).etiqueta:String(v??''));hist(id,c.key,sh(a),sh(b))}});
  n.datos={...n.datos,...nuevo};save();refresh();toast('Guardado')},
 /* archivos */
 upName(inp){const f=inp.files?.[0];if(!f)return;document.getElementById('up_nombre').value=f.name;inp.dataset.size=f.size;if(/\.(eml|msg)$/i.test(f.name)){document.getElementById('up_clase').value='email';A.upClase('email')}},
 upClase(v){document.querySelectorAll('.fld.em').forEach(e=>e.classList.toggle('hidden',v!=='email'))},
 registrarArchivo(nodoId){const nombre=document.getElementById('up_nombre').value.trim();if(!nombre){toast('Indica el archivo o su nombre');return}const clase=document.getElementById('up_clase').value;const a={id:uid(),nodoId,nombre,clase,tamano:Number(document.getElementById('up_file').dataset.size||0),fecha:document.getElementById('up_fecha').value||hoy(),origen:document.getElementById('up_origen').value};if(clase==='email')a.email={de:document.getElementById('up_de').value,para:document.getElementById('up_para').value,asunto:document.getElementById('up_asunto').value,fechaEnvio:a.fecha};S.datos.archivos.push(a);hist(nodoId,'archivos','',nombre);save();refresh();toast('Constancia registrada')},
 borrarArchivo(id){if(!confirm('¿Quitar esta constancia?'))return;S.datos.archivos=S.datos.archivos.filter(a=>a.id!==id);save();refresh()},
 adjuntarCampo(nodoId,key,inp){const fl=inp.files?.[0];if(!fl)return;const c=campoDe(nodo(nodoId).tipo,key);const a={id:uid(),nodoId,campoKey:key,nombre:fl.name,clase:/\.(eml|msg)$/i.test(fl.name)?'email':'documento',tamano:fl.size,fecha:hoy(),origen:''};S.datos.archivos.push(a);hist(nodoId,key,'',fl.name);save();refresh();toast(`Adjuntado a "${c?.label||key}"`)},
 /* formularios */
 nuevoForm(){const nombre=prompt('Nombre de la nueva pantalla:');if(!nombre)return;let id='f_'+slug(nombre);while(S.meta.formularios[id])id+='_';S.meta.formularios[id]={id,nombre,campos:[]};save();location.hash='#/form/'+id},
 fNombre(fid,v){form(fid).nombre=v;save()},
 fAdd(fid){const f=form(fid);const label=prompt('Etiqueta del nuevo campo:');if(!label)return;let key=slug(label);while(f.campos.some(c=>c.key===key))key+='_';f.campos.push({key,label,tipo:'texto',requerido:false,visible:true,ancho:'half'});save();refresh();setTimeout(()=>document.getElementById('fl_'+key)?.focus(),0)},
 fSet(fid,i,prop,v,re){const c=form(fid).campos[i];c[prop]=v;if(prop==='tipo'){if(['lista','radio','multiple'].includes(v)&&!c.catalogo&&!c.opciones)c.opciones=[{valor:'opcion_1',etiqueta:'Opción 1'},{valor:'opcion_2',etiqueta:'Opción 2'}]}save();re?refresh():refreshPreview(fid)},
 fOrigen(fid,i,v){const c=form(fid).campos[i];if(v){c.catalogo=v;delete c.opciones}else{delete c.catalogo;c.opciones=c.opciones||[{valor:'opcion_1',etiqueta:'Opción 1'}]}save();refresh()},
 fInline(fid,i,v){form(fid).campos[i].opciones=v.split(';').map(s=>s.trim()).filter(Boolean).map(s=>({valor:slug(s),etiqueta:s}));save();refreshPreview(fid)},
 fCond(fid,i,prop,v){const c=form(fid).campos[i];if(prop==='campo'){if(!v){delete c.visibleSi;save();refresh();return}c.visibleSi={campo:v,valor:c.visibleSi?.valor||''};save();refresh();return}c.visibleSi.valor=v;save();refreshPreview(fid)},
 fMov(fid,i,d){const a=form(fid).campos;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 fDel(fid,i){const c=form(fid).campos[i];if(!confirm(`¿Quitar el campo "${c.label}" de la pantalla? Los datos ya guardados en ese campo se conservan en los documentos.`))return;form(fid).campos.splice(i,1);save();refresh()},
 /* tipos */
 nuevoTipo(){const nombre=prompt('Nombre del nuevo tipo de nodo (p. ej. Hito, Contrato, Entregable):');if(!nombre)return;let id=slug(nombre);while(tipo(id))id+='_';const fid='f_'+id;S.meta.formularios[fid]={id:fid,nombre:'Ficha de '+nombre.toLowerCase(),campos:[]};S.meta.tipos.push({id,nombre,icono:'●',formId:fid,hijos:[],columnas:[]});save();refresh();toast('Tipo creado. Define quién puede contenerlo y diseña su pantalla.')},
 tSet(i,prop,v,re){S.meta.tipos[i][prop]=v;if(prop==='formId')S.meta.tipos[i].columnas=[];save();if(re)refresh();else renderNav()},
 tHijo(i,hid,on){const t=S.meta.tipos[i];t.hijos=on?[...new Set([...t.hijos,hid])]:t.hijos.filter(x=>x!==hid);save()},
 tCol(i,key,on){const t=S.meta.tipos[i];t.columnas=t.columnas||[];t.columnas=on?[...new Set([...t.columnas,key])]:t.columnas.filter(x=>x!==key);save()},
 tDel(i){const t=S.meta.tipos[i];if(!confirm(`¿Quitar el tipo "${t.nombre}"?`))return;S.meta.tipos.splice(i,1);S.meta.tipos.forEach(o=>o.hijos=o.hijos.filter(x=>x!==t.id));save();refresh()},
 /* catálogos */
 nuevoCat(){const nombre=prompt('Nombre de la nueva lista de opciones:');if(!nombre)return;let id=slug(nombre);while(S.meta.catalogos[id])id+='_';S.meta.catalogos[id]={id,nombre,opciones:[]};save();location.hash='#/catalogos/'+id},
 cNombre(id,v){S.meta.catalogos[id].nombre=v;save()},
 cAdd(id){const et=prompt('Etiqueta de la nueva opción:');if(!et)return;const c=S.meta.catalogos[id];let valor=slug(et);while(c.opciones.some(o=>o.valor===valor))valor+='_';c.opciones.push({valor,etiqueta:et,color:'#8A94A0'});save();refresh()},
 cSet(id,i,prop,v){S.meta.catalogos[id].opciones[i][prop]=v;save()},
 cMov(id,i,d){const a=S.meta.catalogos[id].opciones;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 cDel(id,i){S.meta.catalogos[id].opciones.splice(i,1);save();refresh()},
 /* menú */
 mAdd(){S.meta.menu.push({id:uid(),label:'Nueva opción',icono:'•',tipo:'arbol',visible:true});save();refresh()},
 mSet(i,prop,v,re){const m=S.meta.menu[i];m[prop]=v;if(prop==='tipo'){if(v==='lista')m.target=S.meta.tipos[0]?.id;else if(v==='reporte')m.target=S.meta.reportes[0]?.id;else if(v==='config')m.target='formularios';else m.target=''}save();re?refresh():renderNav()},
 mMov(i,d){const a=S.meta.menu;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 mDel(i){S.meta.menu.splice(i,1);save();refresh()},
 /* reportes */
 rNuevo(){const nombre=prompt('Nombre del nuevo reporte:');if(!nombre)return;const r={id:'r'+uid(),nombre,tipo:S.meta.tipos[0].id,alcance:'',campos:['codigo','nombre','ruta'],filtro:{campo:'',valor:''},agrupar:''};S.meta.reportes.push(r);save();location.hash='#/reporte/'+r.id+'/design'},
 rSet(id,prop,v,re){const r=S.meta.reportes.find(x=>x.id===id);r[prop]=v;if(prop==='tipo'){r.campos=['codigo','nombre','ruta'];r.agrupar='';r.filtro={campo:'',valor:''}}save();if(re)refresh()},
 rFiltro(id,prop,v,re){const r=S.meta.reportes.find(x=>x.id===id);r.filtro=r.filtro||{campo:'',valor:''};r.filtro[prop]=v;if(prop==='campo')r.filtro.valor='';save();if(re)refresh()},
 rCol(id,key,on){const r=S.meta.reportes.find(x=>x.id===id);r.campos=on?[...new Set([...r.campos,key])]:r.campos.filter(x=>x!==key);save();refresh()},
 rDel(id){if(!confirm('¿Eliminar este reporte?'))return;S.meta.reportes=S.meta.reportes.filter(x=>x.id!==id);S.meta.menu=S.meta.menu.filter(m=>!(m.tipo==='reporte'&&m.target===id));save();location.hash='#/reportes'},
 importar(){try{const o=JSON.parse(document.getElementById('imp').value);if(!o.tipos||!o.formularios)throw new Error('falta tipos/formularios');S.meta=o;save();location.hash='#/arbol';refresh();toast('Definición importada')}catch(e){toast('JSON inválido: '+e.message)}}
};

load();window.addEventListener('hashchange',route);route();
</script>
