<title>SisPla Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F1F3F5; --panel:#FFFFFF; --panel2:#F7F8FA; --ink:#1B232D; --muted:#66707C; --line:#D5DBE1;
  --accent:#2E5C8A; --accent-ink:#FFFFFF; --accent-soft:#E3ECF5;
  --design:#A5661A; --design-ink:#FFFFFF; --design-soft:#FBF0DF;
  --side:#1A2530; --side-ink:#C9D3DD; --side-muted:#7C8B99; --side-active:#2E5C8A;
  --ok:#2E7D5B; --bad:#B23A3A; --shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05);
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12171D; --panel:#1B222A; --panel2:#212932; --ink:#E3E8ED; --muted:#93A0AD; --line:#2E3842;
  --accent:#7FADDC; --accent-ink:#0E1A26; --accent-soft:#233748;
  --design:#E2A857; --design-ink:#1F1608; --design-soft:#3B2D18;
  --side:#0D1218; --side-ink:#C2CCD6; --side-muted:#6F7E8C; --side-active:#2E5C8A;
  --ok:#5FB58D; --bad:#E07373; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1B222A; --panel2:#212932; --ink:#E3E8ED; --muted:#93A0AD; --line:#2E3842;
  --accent:#7FADDC; --accent-ink:#0E1A26; --accent-soft:#233748;
  --design:#E2A857; --design-ink:#1F1608; --design-soft:#3B2D18;
  --side:#0D1218; --side-ink:#C2CCD6; --side-muted:#6F7E8C; --side-active:#2E5C8A;
  --ok:#5FB58D; --bad:#E07373; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding-block:18px;padding-inline:0}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand b{font-size:17px;letter-spacing:.02em;display:block}
.brand span{font-size:11.5px;color:var(--side-muted);text-transform:uppercase;letter-spacing:.08em}
nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-size:13.5px}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:var(--side-active);color:#fff}
nav a.sub{padding-left:28px;font-size:13px}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);padding:14px 10px 4px}
nav .ic{width:16px;text-align:center;opacity:.85;font-size:12px}
.side-foot{padding:10px 18px 0;font-size:11.5px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--side-ink);border-radius:5px;padding:4px 8px;font-size:11.5px;margin-top:6px}
main{min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;padding-inline:24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.crumbs .sep{opacity:.5}.crumbs .cur{color:var(--ink);font-weight:500}
#view{padding-block:22px;padding-inline:24px;max-width:1240px;width:100%}
h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
h3{font-size:13px;font-weight:600;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-head .meta{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.design{background:var(--design);border-color:var(--design);color:var(--design-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols.w{grid-template-columns:3fr 2fr}
@media (max-width:900px){.cols,.cols.w{grid-template-columns:1fr}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 6px;margin-left:5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;vertical-align:middle}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.code{font-family:var(--mono);font-size:12px;color:var(--muted)}
.design-bar{background:var(--design-soft);border:1px solid var(--design);color:var(--ink);border-radius:8px;padding:10px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:center;font-size:13px}
.design-bar b{color:var(--design);text-transform:uppercase;letter-spacing:.08em;font-size:11px;white-space:nowrap}
/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.fld label .req{color:var(--bad)}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;width:100%}
.fld textarea{min-height:72px;resize:vertical}
.fld .help{font-size:11.5px;color:var(--muted)}
.fld .opts{display:flex;gap:12px;flex-wrap:wrap;padding-top:4px}
.fld .opts label{font-weight:400;color:var(--ink);display:flex;gap:5px;align-items:center;font-size:13px}
.fld.hidden{display:none}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
/* tables */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td a{text-decoration:none;font-weight:500}
.group-row td{background:var(--panel2);font-weight:600;padding-block:6px}
/* tree */
.tree ul{list-style:none;margin:0;padding-left:22px}
.tree>ul{padding-left:0}
.tree li{margin:2px 0}
.tree .row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.tree .row:hover{background:var(--panel2)}
.tree .row a{text-decoration:none;color:var(--ink);font-weight:500}
.tree .tg{width:16px;color:var(--muted);font-size:11px}
.tree .ic{color:var(--accent);width:16px;text-align:center}
.tree .cnt{font-size:11.5px;color:var(--muted)}
/* designer rows */
.drow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .mv{display:flex;flex-direction:column;gap:2px}
.drow .mv button{padding:0 6px;font-size:11px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;line-height:18px}
.drow .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.drow .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drow input[type=text],.drow select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 7px;font-size:13px}
.drow input.lbl{font-weight:500;min-width:200px;flex:1}
.drow .k{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.drow label.cb{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.drow.off{opacity:.55}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--mono);font-size:12px;overflow-x:auto;margin:0;line-height:1.5}
.note{font-size:12.5px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.list li:last-child{border-bottom:0}
.list a.item{text-decoration:none;font-weight:500;color:var(--ink)}
.list a.item.on{color:var(--accent)}
.hist{font-size:13px}.hist .t{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;padding:12px 0}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);display:inline-block;vertical-align:middle}
input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
@media (max-width:760px){.app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;padding-block:8px}nav{flex-direction:row;flex-wrap:wrap}nav .grp{width:100%;padding-top:6px}.brand{border:0}.side-foot{border:0}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div class="app">
  <aside>
    <div class="brand"><b>SisPla</b><span>Proyectos multinivel · demo</span></div>

  <main>
    <header><div class="crumbs" id="crumbs"></div><div id="topbtn"></div></header>

</div>
<div id="toast"></div>

const rutaStr=id=>ancestros(id).map(n=>n.nombre).join(' › ');

function opciones(f){if(f.catalogo&&S.meta.catalogos[f.catalogo])return S.meta.catalogos[f.catalogo].opciones;return f.opciones||[]}
function etiquetaOpcion(f,v){const o=opciones(f).find(o=>o.valor===v);return o?o:{valor:v,etiqueta:v}}
function campoDe(tid,key){return formDeTipo(tid)?.campos.find(c=>c.key===key)}
function fmtNum(n){return Number(n).toLocaleString('es-PE')}
function fmtBytes(b){return b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB'}
function chip(f,v){const o=etiquetaOpcion(f,v);return `<span class="chip"><i style="background:${esc(o.color||'var(--muted)')}"></i>${esc(o.etiqueta)}</span>`}
function mostrarValor(f,v){
 if(v===undefined||v===null||v==='')return '<span class="note">—</span>';
 switch(f.tipo){
  case 'lista':case 'radio':return chip(f,v);
  case 'multiple':return (Array.isArray(v)?v:[v]).map(x=>chip(f,x)).join(' ');
  case 'checkbox':return v?'Sí':'No';
  case 'numero':return fmtNum(v);
  case 'referencia':{const n=nodo(v);return n?`<a href="#/nodo/${n.id}">${esc(n.nombre)}</a>`:esc(v)}
  default:return esc(v);
 }}

/* ============ formulario dinámico ============ */
function renderForm(f,data,pre='c_'){
 return `<div class="form-grid" id="dynform">`+f.campos.filter(c=>c.visible!==false).map(c=>{
  const id=pre+c.key,v=data[c.key];let ctl='';
  const at=`id="${id}" name="${c.key}"`;
  switch(c.tipo){
   case 'textolargo':ctl=`<textarea ${at}>${esc(v)}</textarea>`;break;
   case 'numero':ctl=`<input type="number" ${at} value="${esc(v)}">`;break;
   case 'fecha':ctl=`<input type="date" ${at} value="${esc(v)}">`;break;
   case 'lista':ctl=`<select ${at}><option value="">— elegir —</option>${opciones(c).map(o=>`<option value="${esc(o.valor)}" ${o.valor===v?'selected':''}>${esc(o.etiqueta)}</option>`).join('')}</select>`;break;
   case 'radio':ctl=`<div class="opts">${opciones(c).map((o,i)=>`<label><input type="radio" name="${c.key}" id="${id}_${i}" value="${esc(o.valor)}" ${o.valor===v?'checked':''}>${esc(o.etiqueta)}</label>`).join('')}</div>`;break;
   case 'multiple':{const arr=Array.isArray(v)?v:[];ctl=`<div class="opts">${opciones(c).map((o,i)=>`<label><input type="checkbox" name="${c.key}" id="${id}_${i}" value="${esc(o.valor)}" ${arr.includes(o.valor)?'checked':''}>${esc(o.etiqueta)}</label>`).join('')}</div>`;break}
   case 'checkbox':ctl=`<div class="opts"><label><input type="checkbox" ${at} ${v?'checked':''}>Sí</label></div>`;break;
   case 'referencia':{const ns=S.datos.nodos.filter(n=>!c.refTipo||n.tipo===c.refTipo);ctl=`<select ${at}><option value="">— ninguno —</option>${ns.map(n=>`<option value="${n.id}" ${n.id===v?'selected':''}>${esc(n.codigo)} · ${esc(n.nombre)}</option>`).join('')}</select>`;break}
   default:ctl=`<input type="text" ${at} value="${esc(v)}">`;
  }
  return `<div class="fld ${c.ancho==='full'?'full':'half'}" data-key="${c.key}"><label for="${id}">${esc(c.label)}${c.requerido?' <span class="req">*</span>':''}</label>${ctl}${c.ayuda?`<div class="help">${esc(c.ayuda)}</div>`:''}</div>`;
 }).join('')+`</div>`;
}
function leerForm(f){
 const root=document.getElementById('dynform');if(!root)return {};const out={};
 f.campos.filter(c=>c.visible!==false).forEach(c=>{
  if(c.tipo==='radio'){const r=root.querySelector(`input[name="${c.key}"]:checked`);out[c.key]=r?r.value:''}
  else if(c.tipo==='multiple'){out[c.key]=[...root.querySelectorAll(`input[name="${c.key}"]:checked`)].map(i=>i.value)}
  else if(c.tipo==='checkbox'){out[c.key]=!!root.querySelector(`[name="${c.key}"]`)?.checked}
  else if(c.tipo==='numero'){const v=root.querySelector(`[name="${c.key}"]`)?.value;out[c.key]=v===''?'':Number(v)}
  else out[c.key]=root.querySelector(`[name="${c.key}"]`)?.value??'';
 });return out;
}
function aplicarCondiciones(f){
 const root=document.getElementById('dynform');if(!root)return;
 const ev=()=>{const vals=leerForm(f);f.campos.forEach(c=>{if(!c.visibleSi||!c.visibleSi.campo)return;const el=root.querySelector(`.fld[data-key="${c.key}"]`);if(!el)return;const v=vals[c.visibleSi.campo];const ok=String(Array.isArray(v)?v.includes(c.visibleSi.valor):v)===String(c.visibleSi.valor);el.classList.toggle('hidden',!ok)})};
 root.addEventListener('input',ev);root.addEventListener('change',ev);ev();
}

function ejecutarReporte(r){
 let ns=S.datos.nodos.filter(n=>n.tipo===r.tipo);
 if(r.alcance){const ids=new Set(desc(r.alcance).map(n=>n.id));ns=ns.filter(n=>ids.has(n.id))}
 if(r.filtro?.campo&&r.filtro.valor!==''){ns=ns.filter(n=>{const v=n.datos[r.filtro.campo];return Array.isArray(v)?v.includes(r.filtro.valor):String(v??'')===String(r.filtro.valor)})}
 const grupos={};ns.forEach(n=>{const g=r.agrupar?String(n.datos[r.agrupar]??'(sin valor)'):'';(grupos[g]=grupos[g]||[]).push(n)});
 return {ns,grupos};
}
function pipelineMongo(r){
 const match={tipo:r.tipo};if(r.alcance)match.path=r.alcance;if(r.filtro?.campo&&r.filtro.valor!=='')match['datos.'+r.filtro.campo]=r.filtro.valor;
 const project={};r.campos.forEach(k=>project[['nombre','codigo','ruta'].includes(k)?k:'datos.'+k]=1);
 const p=[{$match:match},{$project:project}];
 if(r.agrupar){const g={_id:'$datos.'+r.agrupar,total:{$sum:1},filas:{$push:'$$ROOT'}};formDeTipo(r.tipo)?.campos.filter(c=>c.tipo==='numero'&&r.campos.includes(c.key)).forEach(c=>g['suma_'+c.key]={$sum:'$datos.'+c.key});p.push({$group:g},{$sort:{_id:1}})}
 return JSON.stringify(p,null,2);
}

 const cols=r.campos.map(k=>base.find(b=>b.key===k)||f?.campos.find(c=>c.key===k)).filter(Boolean);

 const numCols=cols.filter(c=>c.tipo==='numero');

 const dsg=design?`<div class="card"><h3>Definición</h3><div class="form-grid">

 const n=S.datos.nodos.filter(x=>!x.parentId).length+1;return `PRJ-${String(n).padStart(3,'0')}`;
}
function hist(nodoId,campo,antes,despues){S.datos.historial.unshift({nodoId,fecha:new Date().toISOString().slice(0,16).replace('T',' '),campo,antes,despues})}
function refresh(){route()}
const A={
 reset(){if(confirm('¿Volver a los datos y definiciones iniciales del demo?')){S=seed();save();location.hash='#/arbol';refresh();toast('Demo restablecido')}},
 copiar(txt,msg){navigator.clipboard?.writeText(txt).then(()=>toast(msg)).catch(()=>toast('No se pudo copiar'))},
 /* nodos */
 nuevoNodo(parentId,tid){const t=tipo(tid);const nombre=prompt(`Nombre de la nueva ${t.nombre.toLowerCase()}:`);if(!nombre)return;const n={id:uid(),tipo:tid,parentId,codigo:siguienteCodigo(parentId,tid),nombre,creado:hoy(),datos:{}};S.datos.nodos.push(n);save();location.hash='#/nodo/'+n.id;toast('Creado '+n.codigo)},
 renombrar(id){const n=nodo(id);const v=prompt('Nuevo nombre:',n.nombre);if(v&&v!==n.nombre){hist(id,'nombre',n.nombre,v);n.nombre=v;save();refresh()}},
 borrarNodo(id){const n=nodo(id);const d=desc(id);if(!confirm(`¿Eliminar "${n.nombre}"${d.length?` y sus ${d.length} internos`:''}?`))return;const ids=new Set([id,...d.map(x=>x.id)]);S.datos.nodos=S.datos.nodos.filter(x=>!ids.has(x.id));S.datos.archivos=S.datos.archivos.filter(a=>!ids.has(a.nodoId));save();location.hash=n.parentId?'#/nodo/'+n.parentId+'/hijos':'#/arbol';toast('Eliminado')},
 guardarNodo(id){const n=nodo(id);const f=formDeTipo(n.tipo);const nuevo=leerForm(f);
  const falta=f.campos.filter(c=>c.requerido&&c.visible!==false&&!document.querySelector(`.fld[data-key="${c.key}"]`)?.classList.contains('hidden')).find(c=>{const v=nuevo[c.key];return v===''||v===undefined||(Array.isArray(v)&&!v.length)});
  if(falta){toast(`Falta completar: ${falta.label}`);document.getElementById('c_'+falta.key)?.focus();return}
  f.campos.forEach(c=>{const a=n.datos[c.key],b=nuevo[c.key];if(JSON.stringify(a??'')!==JSON.stringify(b??'')){const sh=v=>c.tipo==='checkbox'?(v?'Sí':'No'):Array.isArray(v)?v.join(', '):(['lista','radio'].includes(c.tipo)&&v?etiquetaOpcion(c,v).etiqueta:String(v??''));hist(id,c.key,sh(a),sh(b))}});
  n.datos={...n.datos,...nuevo};save();refresh();toast('Guardado')},
 /* archivos */
 upName(inp){const f=inp.files?.[0];if(!f)return;document.getElementById('up_nombre').value=f.name;inp.dataset.size=f.size;if(/\.(eml|msg)$/i.test(f.name)){document.getElementById('up_clase').value='email';A.upClase('email')}},
 upClase(v){document.querySelectorAll('.fld.em').forEach(e=>e.classList.toggle('hidden',v!=='email'))},
 registrarArchivo(nodoId){const nombre=document.getElementById('up_nombre').value.trim();if(!nombre){toast('Indica el archivo o su nombre');return}const clase=document.getElementById('up_clase').value;const a={id:uid(),nodoId,nombre,clase,tamano:Number(document.getElementById('up_file').dataset.size||0),fecha:document.getElementById('up_fecha').value||hoy(),origen:document.getElementById('up_origen').value};if(clase==='email')a.email={de:document.getElementById('up_de').value,para:document.getElementById('up_para').value,asunto:document.getElementById('up_asunto').value,fechaEnvio:a.fecha};S.datos.archivos.push(a);hist(nodoId,'archivos','',nombre);save();refresh();toast('Constancia registrada')},
 borrarArchivo(id){if(!confirm('¿Quitar esta constancia?'))return;S.datos.archivos=S.datos.archivos.filter(a=>a.id!==id);save();refresh()},
 /* formularios */
 nuevoForm(){const nombre=prompt('Nombre de la nueva pantalla:');if(!nombre)return;let id='f_'+slug(nombre);while(S.meta.formularios[id])id+='_';S.meta.formularios[id]={id,nombre,campos:[]};save();location.hash='#/form/'+id},
 fNombre(fid,v){form(fid).nombre=v;save()},
 fAdd(fid){const f=form(fid);const label=prompt('Etiqueta del nuevo campo:');if(!label)return;let key=slug(label);while(f.campos.some(c=>c.key===key))key+='_';f.campos.push({key,label,tipo:'texto',requerido:false,visible:true,ancho:'half'});save();refresh();setTimeout(()=>document.getElementById('fl_'+key)?.focus(),0)},
 fSet(fid,i,prop,v,re){const c=form(fid).campos[i];c[prop]=v;if(prop==='tipo'){if(['lista','radio','multiple'].includes(v)&&!c.catalogo&&!c.opciones)c.opciones=[{valor:'opcion_1',etiqueta:'Opción 1'},{valor:'opcion_2',etiqueta:'Opción 2'}]}save();re?refresh():refreshPreview(fid)},
 fOrigen(fid,i,v){const c=form(fid).campos[i];if(v){c.catalogo=v;delete c.opciones}else{delete c.catalogo;c.opciones=c.opciones||[{valor:'opcion_1',etiqueta:'Opción 1'}]}save();refresh()},
 fInline(fid,i,v){form(fid).campos[i].opciones=v.split(';').map(s=>s.trim()).filter(Boolean).map(s=>({valor:slug(s),etiqueta:s}));save();refreshPreview(fid)},
 fCond(fid,i,prop,v){const c=form(fid).campos[i];if(prop==='campo'){if(!v){delete c.visibleSi;save();refresh();return}c.visibleSi={campo:v,valor:c.visibleSi?.valor||''};save();refresh();return}c.visibleSi.valor=v;save();refreshPreview(fid)},
 fMov(fid,i,d){const a=form(fid).campos;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 fDel(fid,i){const c=form(fid).campos[i];if(!confirm(`¿Quitar el campo "${c.label}" de la pantalla? Los datos ya guardados en ese campo se conservan en los documentos.`))return;form(fid).campos.splice(i,1);save();refresh()},
 /* tipos */
 nuevoTipo(){const nombre=prompt('Nombre del nuevo tipo de nodo (p. ej. Hito, Contrato, Entregable):');if(!nombre)return;let id=slug(nombre);while(tipo(id))id+='_';const fid='f_'+id;S.meta.formularios[fid]={id:fid,nombre:'Ficha de '+nombre.toLowerCase(),campos:[]};S.meta.tipos.push({id,nombre,icono:'●',formId:fid,hijos:[],columnas:[]});save();refresh();toast('Tipo creado. Define quién puede contenerlo y diseña su pantalla.')},
 tSet(i,prop,v,re){S.meta.tipos[i][prop]=v;if(prop==='formId')S.meta.tipos[i].columnas=[];save();if(re)refresh();else renderNav()},
 tHijo(i,hid,on){const t=S.meta.tipos[i];t.hijos=on?[...new Set([...t.hijos,hid])]:t.hijos.filter(x=>x!==hid);save()},
 tCol(i,key,on){const t=S.meta.tipos[i];t.columnas=t.columnas||[];t.columnas=on?[...new Set([...t.columnas,key])]:t.columnas.filter(x=>x!==key);save()},
 tDel(i){const t=S.meta.tipos[i];if(!confirm(`¿Quitar el tipo "${t.nombre}"?`))return;S.meta.tipos.splice(i,1);S.meta.tipos.forEach(o=>o.hijos=o.hijos.filter(x=>x!==t.id));save();refresh()},
 /* catálogos */
 nuevoCat(){const nombre=prompt('Nombre de la nueva lista de opciones:');if(!nombre)return;let id=slug(nombre);while(S.meta.catalogos[id])id+='_';S.meta.catalogos[id]={id,nombre,opciones:[]};save();location.hash='#/catalogos/'+id},
 cNombre(id,v){S.meta.catalogos[id].nombre=v;save()},
 cAdd(id){const et=prompt('Etiqueta de la nueva opción:');if(!et)return;const c=S.meta.catalogos[id];let valor=slug(et);while(c.opciones.some(o=>o.valor===valor))valor+='_';c.opciones.push({valor,etiqueta:et,color:'#8A94A0'});save();refresh()},
 cSet(id,i,prop,v){S.meta.catalogos[id].opciones[i][prop]=v;save()},
 cMov(id,i,d){const a=S.meta.catalogos[id].opciones;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 cDel(id,i){S.meta.catalogos[id].opciones.splice(i,1);save();refresh()},
 /* menú */
 mAdd(){S.meta.menu.push({id:uid(),label:'Nueva opción',icono:'•',tipo:'arbol',visible:true});save();refresh()},
 mSet(i,prop,v,re){const m=S.meta.menu[i];m[prop]=v;if(prop==='tipo'){if(v==='lista')m.target=S.meta.tipos[0]?.id;else if(v==='reporte')m.target=S.meta.reportes[0]?.id;else if(v==='config')m.target='formularios';else m.target=''}save();re?refresh():renderNav()},
 mMov(i,d){const a=S.meta.menu;const j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();refresh()},
 mDel(i){S.meta.menu.splice(i,1);save();refresh()},
 /* reportes */
 rNuevo(){const nombre=prompt('Nombre del nuevo reporte:');if(!nombre)return;const r={id:'r'+uid(),nombre,tipo:S.meta.tipos[0].id,alcance:'',campos:['codigo','nombre','ruta'],filtro:{campo:'',valor:''},agrupar:''};S.meta.reportes.push(r);save();location.hash='#/reporte/'+r.id+'/design'},
 rSet(id,prop,v,re){const r=S.meta.reportes.find(x=>x.id===id);r[prop]=v;if(prop==='tipo'){r.campos=['codigo','nombre','ruta'];r.agrupar='';r.filtro={campo:'',valor:''}}save();if(re)refresh()},
 rFiltro(id,prop,v,re){const r=S.meta.reportes.find(x=>x.id===id);r.filtro=r.filtro||{campo:'',valor:''};r.filtro[prop]=v;if(prop==='campo')r.filtro.valor='';save();if(re)refresh()},
 rCol(id,key,on){const r=S.meta.reportes.find(x=>x.id===id);r.campos=on?[...new Set([...r.campos,key])]:r.campos.filter(x=>x!==key);save();refresh()},
 rDel(id){if(!confirm('¿Eliminar este reporte?'))return;S.meta.reportes=S.meta.reportes.filter(x=>x.id!==id);S.meta.menu=S.meta.menu.filter(m=>!(m.tipo==='reporte'&&m.target===id));save();location.hash='#/reportes'},
 importar(){try{const o=JSON.parse(document.getElementById('imp').value);if(!o.tipos||!o.formularios)throw new Error('falta tipos/formularios');S.meta=o;save();location.hash='#/arbol';refresh();toast('Definición importada')}catch(e){toast('JSON inválido: '+e.message)}}
};

load();window.addEventListener('hashchange',route);route();
</script>
